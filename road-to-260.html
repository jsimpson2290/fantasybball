<style>

.sr .bar i::after{content:"";position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

.gp.g4 .n{background:var(--yellow);color:#0b0b0b;border-color:var(--yellow)}

.gp.g3 .chip{border-color:var(--faint);color:var(--muted)}
.gp.g2 .chip,.gp.g1 .chip{border-color:var(--red);color:var(--red)}
.chip.mine{background:var(--yellow);color:#0b0b0b;border-color:var(--line)}

.r.bn,.r.out{opacity:.62}
.r .sl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--muted)}

.r .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}

.tag.out{background:var(--ink);color:var(--bg)}
.tag.gtd{border:1.5px solid var(--line)}
.d{text-align:center;font-variant-numeric:tabular-nums;min-height:34px}
.d .dl{display:none}
.d .v{display:block;font-size:14px;font-weight:600;color:var(--ink);opacity:.32}
.d .o{display:block;font-size:9.5px;font-weight:700;color:var(--red);opacity:.7;letter-spacing:.02em}
.d.best .v{opacity:1;font-weight:900;font-size:15.5px}
.d.best .v::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--yellow);border:1px solid var(--ink);margin-left:3px;vertical-align:5px}
.d.best .o{opacity:1}
.d.model .v{font-style:italic}
.d.played .v{text-decoration:underline;text-decoration-color:var(--yellow);text-underline-offset:3px;text-decoration-thickness:2px}
.lk{text-align:right;font-variant-numeric:tabular-nums}
.lk b{font-size:17px;font-weight:900}
.lk small{display:block;font-size:10px;color:var(--muted)}
.notes summary{cursor:pointer;display:flex;align-items:baseline;gap:10px;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary::before{content:'\25B8';color:var(--muted)}
.notes details[open] summary::before{content:'\25BE'}
.notes h2{font-size:15px;margin:0;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.notes .hint{color:var(--muted);font-size:12px}
.notes h3{font-size:13px;margin:16px 0 4px;letter-spacing:.04em;text-transform:uppercase}
.notes p,.notes li{font-size:14px;max-width:80ch;margin:4px 0}

/* --- qrnav: shared site nav --- */
#qrnav-rail{position:fixed;top:0;left:0;bottom:0;width:56px;background:var(--surface,var(--card,#fff));border-right:1.5px solid var(--line,#ddd);z-index:200;display:flex;flex-direction:column;overflow:hidden;transition:width .22s cubic-bezier(0,0,.2,1)}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1=x=>Number(x).toFixed(1);
function render(){
  if($('#brand'))$('#brand').textContent=DATA.meta.league||'';
  const D=DATA, T=D.meta.target, slots=D.slots;
  $('#back').setAttribute('href',location.protocol==='file:'?'roster_quickref.html':'index.html');
  $('#fwdFA').setAttribute('href',location.protocol==='file:'?'free_agents.html':'free-agents.html');
  $('#wk').textContent=`${D.week.label} \u00B7 ${D.week.dates}`;
  $('#lede').textContent=`Best projected total (Sleeper's numbers, no uplift) and lock target with +${D.meta.sdExtra} SD per slot. ${D.meta.league}, updated ${D.meta.asOf}.`;
  if(D.meta.prototype){$('#banner').hidden=false;$('#banner').textContent='Layout preview with sample numbers and made-up players. The real page is built from my Sleeper roster and Sleeper projections.';}
  // score card
  const projTotal=+slots.reduce((a,s)=>a+(s.proj||0),0).toFixed(1);
  const scale=Math.max(45,Math.ceil(Math.max(...slots.map(s=>s.lock),0)+3)), pace=T/slots.length, gap=D.gap;
  const mx=Math.max(T*1.12,D.total*1.05), pct=v=>Math.min(100,100*v/mx);
  $('#score').innerHTML=`<p class="cap">Projected score \u00B7 best lineup</p>
    <div class="bignum"><span class="num">${f1(projTotal)}</span><span class="who">Best projection</span>
      <span style="font-size:26px;font-weight:300;color:var(--muted);align-self:center;padding:0 6px">&rarr;</span>
      <span class="num" style="font-size:clamp(40px,5.5vw,64px)">${f1(D.total)}</span><span class="who">+${D.meta.sdExtra}\u202FSD lock</span>
      <span class="delta ${gap>0?'short':'over'}">${gap>0?f1(gap)+' short of '+T:f1(-gap)+' over '+T}</span></div>
    <div class="meter" role="img" aria-label="Lock target ${f1(D.total)} against a target of ${T}"><div class="fill" style="width:${pct(D.total)}%"></div>
      <div class="tick" style="left:${pct(T)}%"></div><span class="tl" style="left:${pct(T)}%">${T}</span></div>
    <div class="slots">`+slots.map(s=>`<div class="sr${s.name?'':' empty'}"><span class="lb">${esc(s.slot)}</span><span class="pn">${esc(s.name?s.short:'empty')}</span>
      <div class="bar"><i style="width:${100*s.lock/scale}%"></i><b style="left:${100*pace/scale}%"></b></div><span class="val">${s.name?f1(s.lock):'\u2013'}</span></div>`).join('')+`</div>
    <p class="foot">Projection: each slot's best game as projected by Sleeper. Lock (+${D.meta.sdExtra}\u202FSD): adds variance upside. Dashed line = pace to ${T} (${f1(pace)} each).</p>`;
  // games per team
  const mine=new Set(D.mine||[]), keys=Object.keys(D.gpt).sort((a,b)=>b-a);
  $('#gpt').innerHTML=`<p class="cap">Games per team</p>`+keys.map(k=>`<div class="gp g${k}"><div class="n">${k}</div><div class="chips">${D.gpt[k].map(t=>`<span class="chip${mine.has(t)?' mine':''}">${esc(t)}</span>`).join('')}</div></div>`).join('')+
    `<p class="legend"><span class="chip mine">TEAM</span> a team I have a player on</p>`;
  // guide
  const days=D.week.days;
  const head=`<div class="gh"><div></div><div></div><div class="days">${days.map(d=>`<div class="${d.today?'today':''}"><span class="dn">${d.key}</span><small>${d.today?'TODAY':d.date}${d.league!=null&&!d.today?'':''}</small>${d.league!=null?`<small>${d.league} gms</small>`:''}</div>`).join('')}</div><div style="text-align:right">LOCK</div></div>`;
  const rowsHtml=D.rows.map((r,ri)=>{
    const byDay={}; (r.games||[]).forEach(g=>byDay[g.day]=g);
    const cells=days.map(d=>{const g=byDay[d.key];
      if(!g) return `<div class="d"><span class="dl">${d.key}</span><span class="v" style="opacity:.0">&nbsp;</span></div>`;
      return `<div class="d${g.best?' best':''}${g.src==='model'?' model':''}${g.src==='actual'?' played':''}" title="${g.src==='sleeper'?'Sleeper projection':g.src==='actual'?'actual score':'my model (no Sleeper projection)'}"><span class="dl">${d.key}</span><span class="v">${f1(g.pts)}</span><span class="o">${g.opp?(g.away?'@':'vs ')+esc(g.opp):''}</span></div>`;}).join('');
    const tag=r.slot==='OUT'?'<span class="tag out">OUT</span>':(r.status==='GTD'?`<span class="tag gtd" title="${esc(r.note)}">GTD</span>`:'');
    const lk=r.lock!=null?`<b>${f1(r.lock)}</b><small>${r.best_src==='actual'?'actual':f1(r.best_pts)+' + '+f1(r.sd)}</small>`:'<b>\u2013</b>';
    return `<div class="r ${r.slot==='BN'?'bn':r.slot==='OUT'?'out':''}" data-idx="${ri}"><div class="sl">${esc(r.slot==='OUT'?'':r.slot)}</div><div class="nm"><span class="pname" title="Click for season game log">${esc(r.name)}</span>${tag}<small>${esc(r.team)}${r.pos?' \u00B7 '+esc(r.pos):''}</small></div><div class="days">${cells}</div><div class="lk">${lk}</div></div>`;}).join('');
  $('#guide').innerHTML=`<p class="cap">Roster lock-in guide</p>${head}${rowsHtml}<p class="legend">Bold with a yellow dot = the game to lock. Faded = other games. Italic = my model's number because Sleeper had no projection. Underlined = already played (actual score).</p>`;
  // notes
  $('#notes').innerHTML=`<details><summary><h2>How this page is built</h2><span class="hint">click to show</span></summary>
  <h3>The two numbers</h3><p>For each player on my roster, take every game his team plays this week and Sleeper's projected fantasy points for that game (in my league's scoring). The <b>best projection</b> is the sum of each slot's top projected game with no uplift — the realistic floor. The <b>lock target</b> adds ${D.meta.sdExtra} SD to each player's best game to account for variance upside. The page fills my starting slots (${slots.map(s=>s.slot).join(', ')}) to maximize the lock total, respecting position eligibility.</p>
  <h3>Why +${D.meta.sdExtra} SD</h3><p>A projection is a typical game. A player who is locked in at his best game has to beat the typical outcome to reach the high end, so the lock score adds ${D.meta.sdExtra} standard deviation: the spread of his game scores last season when he had 30+ games, otherwise an assumed ${f1(6.3)}. It is the same spread the roster page uses.</p>
  <h3>The road to ${T}</h3><p>${T} is the target. The gap is the target minus the potential. The dashed line on each slot bar is the pace needed if every slot contributed equally.</p>
  <h3>Played games</h3><p>A game that is already over counts as its actual score with no SD added, and is underlined.</p>
  <h3>What it cannot see</h3><ul><li>It assumes each player plays every game on his schedule. Rest days and injuries can change that.</li><li>A player can only be locked once, so two slots cannot use the same player.</li><li>Projections move. The page shows when they were fetched.</li><li>Opponents on the fantasy side are not modeled; this is a ceiling for my own roster.</li></ul>
  <p class="hint">Projection source: ${esc(D.meta.source)}${D.meta.projFetched?', fetched '+esc(D.meta.projFetched):''}.</p></details>`;
}
function attachGameLog(){

  document.querySelectorAll('#guide .r').forEach(el=>{
    const pname=el.querySelector('.pname');
    if(!pname)return;
    pname.addEventListener('click',e=>{
      e.stopPropagation();
      const ri=+el.dataset.idx;

      const nxt=el.nextElementSibling;
      if(nxt&&nxt.classList.contains('r260-expand')){nxt.remove();return;}
      document.querySelectorAll('#guide .r260-expand').forEach(x=>x.remove());
      if(!r||!r.games_log||!r.games_log.length){return;}
      const hdrs=['Date','Min','PTS','REB','AST','STL','BLK','TO','3PM','FP'];
      const grows=r.games_log.map(g=>{
        const vals=[g.date,f1(g.min),g.pts,g.reb,g.ast,g.stl,g.blk,g.tov,g.fg3m,f1(g.fp)];
        return '<tr>'+vals.map((v,i)=>`<td class="${i===9?'fp':''}">${esc(v)}</td>`).join('')+'</tr>';
      }).join('');

      ex.innerHTML=`<table class="r260-exp-tbl"><thead><tr>${hdrs.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${grows}</tbody></table>`;
      el.after(ex);
    });
  });
}

(function plannerInit(){
  var PL=DATA.planner,el=document.getElementById('planner-card');
  if(!PL||!el)return;
  el.hidden=false;
  var SLOTS=DATA.meta.slots,todayIso=PL.today_iso;

  // --- localStorage helpers ---
  var LK=function(i){return 'qrLock_'+DATA.meta.league+'_'+DATA.week.label+'_'+i;};
  var BK=function(n){return 'qrBust_'+DATA.meta.league+'_'+DATA.week.label+'_'+n;};
  function getLock(i){try{var v=localStorage.getItem(LK(i));return!!(v&&v.length);}catch(e){return false;}}
  function getLockName(i){try{var v=localStorage.getItem(LK(i));return(v&&v.length)?v:null;}catch(e){return null;}}
  function setLock(i,name){try{if(name){localStorage.setItem(LK(i),name);}else{localStorage.removeItem(LK(i));}}catch(e){}}
  function getBust(n,proj){try{var v=localStorage.getItem(BK(n));if(v!==null)return+v;}catch(e){}return+((proj*(PL.settings.bust_pct||0.6)).toFixed(1));}
  function setBust(n,v){try{localStorage.setItem(BK(n),(+v).toFixed(1));}catch(e){}}

  // --- time formatting ---
  function fmtTime(utc){
    if(!utc)return'';
    try{var d=new Date(utc),h=d.getHours()%12||12,m=d.getMinutes();
      return h+':'+(m<10?'0':'')+m+' '+(d.getHours()>=12?'PM':'AM');}
    catch(e){return utc;}
  }

  // --- Slot eligibility (mirrors qr_common.py) ---
  var SLOT_RULE={PG:['PG'],SG:['SG'],SF:['SF'],PF:['PF'],C:['C'],G:['PG','SG'],F:['SF','PF'],UTIL:['PG','SG','SF','PF','C']};
  function parsePos(s){
    if(!s)return[];
    var t=(Array.isArray(s)?s.join('/'):String(s)).toUpperCase();
    var out=[];
    (t.match(/PG|SG|SF|PF|C/g)||[]).forEach(function(p){if(out.indexOf(p)<0)out.push(p);});
    var rest=t.replace(/PG|SG|SF|PF|C/g,'');
    if(rest.indexOf('G')>-1){['PG','SG'].forEach(function(p){if(out.indexOf(p)<0)out.push(p);});}
    if(rest.indexOf('F')>-1){['SF','PF'].forEach(function(p){if(out.indexOf(p)<0)out.push(p);});}
    return out;
  }
  function slotOk(slot,posArr){
    if(slot==='UTIL')return true;
    var rule=SLOT_RULE[slot];if(!rule)return false;
    return posArr.some(function(p){return rule.indexOf(p)>-1;});
  }

  // --- Hungarian algorithm (port of qr_common.py) ---
  function hungarian(cost){
    var n=cost.length,m=cost[0].length,INF=1e15;
    var u=[],v=[],p=[],way=[];
    for(var i=0;i<=n;i++)u.push(0);
    for(var j=0;j<=m;j++){v.push(0);p.push(0);way.push(0);}
    for(var i=1;i<=n;i++){
      p[0]=i;var j0=0,minv=[],used=[];
      for(var j=0;j<=m;j++){minv.push(INF);used.push(false);}
      do{
        used[j0]=true;var i0=p[j0],delta=INF,j1=0;
        for(var j=1;j<=m;j++){if(!used[j]){var cur=cost[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0;}if(minv[j]<delta){delta=minv[j];j1=j;}}}
        for(var j=0;j<=m;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta;}else minv[j]-=delta;}
        j0=j1;
      }while(p[j0]!==0);
      do{var j1=way[j0];p[j0]=p[j1];j0=j1;}while(j0!==0);
    }
    var assign=[];for(var i=0;i<n;i++)assign.push(-1);
    for(var j=1;j<=m;j++)if(p[j])assign[p[j]-1]=j-1;
    return assign;
  }

  // --- R260 lock-status helpers ---
  function getLockByPlayer(name){try{return localStorage.getItem('qrLockPl_'+DATA.meta.league+'_'+DATA.week.label+'_'+name)==='1';}catch(e){return false;}}
  function setLockByPlayer(name,on){try{if(on)localStorage.setItem('qrLockPl_'+DATA.meta.league+'_'+DATA.week.label+'_'+name,'1');else localStorage.removeItem('qrLockPl_'+DATA.meta.league+'_'+DATA.week.label+'_'+name);}catch(e){}}

  // --- Plan computation (R260-aware) ---
  function computePlan(dayIso){
    var tipGames=(PL.tip_times||{})[dayIso]||[];
    var byTeam={};
    tipGames.forEach(function(g){byTeam[g.home]=g;byTeam[g.away]=g;});
    var isToday=dayIso===todayIso;

    // Build tonight's active pool (players with tip times tonight)
    var activeByName={};
    (DATA.rows||[]).forEach(function(r){
      if(r.out)return;
      var dg=(r.games||[]).filter(function(g){return g.iso===dayIso&&g.pts!=null;})[0];
      if(!dg)return;
      var tg=byTeam[r.team];if(!tg)return;
      activeByName[r.name]={name:r.name,pos:r.pos,posArr:parsePos(r.pos),team:r.team,proj:dg.pts,src:dg.src,tip_utc:tg.tip_utc,tip_ts:tg.tip_ts};
    });

    // Categorise R260 roster rows by lock status
    var lockTonight=[],settled=[],lockFuture=[];
    var lockTonightNames={};
    (DATA.rows||[]).forEach(function(r){
      if(r.out)return;
      if(r.slot==='BN'||r.slot==='OUT')return;
      var bestGame=(r.games||[]).filter(function(g){return g.best;})[0];
      if(!bestGame)return;
      var status=bestGame.src==='actual'?'settled':bestGame.iso===dayIso?'tonight':'future';
      var row={name:r.name,r260Slot:r.slot,lockScore:r.lock,lockSrc:r.best_src,lockDay:bestGame.day,posArr:parsePos(r.pos),tonight:activeByName[r.name]||null};
      if(status==='tonight'){lockTonight.push(row);lockTonightNames[r.name]=true;}
      else if(status==='settled')settled.push(row);
      else lockFuture.push(row);
    });

    // Fallback pool: players with games tonight not already a lock-tonight primary
    var bust_pct=PL.settings.bust_pct||0.6,mins_full=PL.settings.minutes_full_game||140;
    var allTonightArr=Object.keys(activeByName).map(function(n){return activeByName[n];});

    // For each lock-tonight player compute fallbacks + bust trigger
    lockTonight.forEach(function(lt){
      var p=lt.tonight;if(!p)return;
      var proj=p.proj;
      lt.proj=+proj.toFixed(1);
      lt.tip_utc=p.tip_utc;lt.tip_ts=p.tip_ts;
      lt.userLocked=isToday&&getLockByPlayer(lt.name);
      lt.bust_trigger=lt.userLocked?null:(isToday?getBust(lt.name,proj):+(proj*bust_pct).toFixed(1));
      var fallbacks=[];
      allTonightArr.forEach(function(bench){
        if(lockTonightNames[bench.name])return;
        if(!slotOk(lt.r260Slot,bench.posArr))return;
        if(bench.tip_ts<=p.tip_ts)return;
        var dm=(bench.tip_ts-p.tip_ts)/60,ps=dm<mins_full;
        var eff=lt.bust_trigger!=null?+(lt.bust_trigger*(ps?dm/mins_full:1)).toFixed(1):null;
        var ls=lt.name.split(' ').pop(),lb=bench.name.split(' ').pop();
        fallbacks.push({name:bench.name,proj:+bench.proj.toFixed(1),tip_utc:bench.tip_utc,tip_ts:bench.tip_ts,
                        effective_trigger:eff,pace_scaled:ps,conflict:false,
                        instruction:eff!=null?'If '+ls+' has < '+eff+' pts when '+lb+' tips, swap.':lb+' tips later as a fallback option.'});
      });
      fallbacks.sort(function(a,b){return a.tip_ts-b.tip_ts;});
      lt.fallbacks=fallbacks;
    });

    // Flag shared fallbacks as conflicts
    var fbUsage={};
    lockTonight.forEach(function(lt){(lt.fallbacks||[]).forEach(function(fb){(fbUsage[fb.name]||(fbUsage[fb.name]=[])).push(lt.r260Slot);});});
    var conflicts={};Object.keys(fbUsage).forEach(function(n){if(fbUsage[n].length>1)conflicts[n]=fbUsage[n];});
    lockTonight.forEach(function(lt){(lt.fallbacks||[]).forEach(function(fb){if(conflicts[fb.name])fb.conflict=true;});});

    var timeline=[];
    lockTonight.forEach(function(lt){
      if(!lt.tonight)return;
      timeline.push({type:'starter_tip',player:lt.name,slot:lt.r260Slot,tip_utc:lt.tip_utc,tip_ts:lt.tip_ts});
      (lt.fallbacks||[]).forEach(function(fb){timeline.push({type:'deadline',fallback:fb.name,for_slot:lt.r260Slot,for_player:lt.name,
        tip_utc:fb.tip_utc,tip_ts:fb.tip_ts,eff:fb.effective_trigger,pace_scaled:fb.pace_scaled,instruction:fb.instruction});});
    });
    timeline.sort(function(a,b){return a.tip_ts-b.tip_ts;});
    return{lockTonight:lockTonight,settled:settled,lockFuture:lockFuture,conflicts:conflicts,timeline:timeline};
  }

  // --- Rendering ---
  var activeDayIso=todayIso||((DATA.week.days[0]||{}).iso);

  function renderPlan(){
    var bodyEl=document.getElementById(‘plan-body’),tlEl=document.getElementById(‘plan-timeline’);
    if(!bodyEl||!tlEl)return;
    var plan=computePlan(activeDayIso),isToday=activeDayIso===todayIso;
    var warnEl=document.getElementById(‘planner-warn’);
    if(warnEl){
      if(!PL.tip_file_ok){
        warnEl.hidden=false;
        warnEl.textContent=’Tip times are ‘+(PL.tip_file_age_h!=null?PL.tip_file_age_h.toFixed(0)+’ h old’:’missing’)+’. Run pull_schedule.py to refresh. Times shown are unreliable.’;
      } else warnEl.hidden=true;
    }

    var hasAny=plan.lockTonight.length||plan.settled.length||plan.lockFuture.length;
    if(!hasAny){bodyEl.innerHTML=’<p style="color:var(--muted);font-size:13px;margin:8px 0">No roster players with Sleeper projections and tip times found for this day.</p>’;tlEl.innerHTML=’’;return;}

    var out=’’;

    // --- Section 1: Lock targets tonight ---
    if(plan.lockTonight.length){
      out+=’<p class="pl-sec-hd">Lock targets tonight</p>’;
      out+=’<div class="ps-hd"><div></div><div>Player</div><div class="ti-h">Tip</div><div>Proj</div>’+(isToday?’<div>Bust</div><div></div>’:’’)+’</div>’;
      plan.lockTonight.forEach(function(lt){
        var ts=lt.tip_utc?fmtTime(lt.tip_utc):’—‘;
        var isLocked=isToday&&lt.userLocked;
        out+=’<div class="ps">’
          +’<div class="lb">’+esc(lt.r260Slot)+’</div>’
          +’<div class="pn">’+esc(lt.name)+’</div>’
          +’<div class="ti">’+esc(ts)+’</div>’
          +’<div class="pj">’+f1(lt.proj||0)+’</div>’;
        if(isToday){
          if(isLocked){
            out+=’<div></div><div><button class="lk-btn on" data-player="’+esc(lt.name)+’" aria-label="Unlock ‘+esc(lt.name)+’">LOCK</button></div>’;
          } else {
            out+=’<div class="bt-wrap"><input class="bt-in" type="number" step="0.5" min="0" max="99" data-name="’+esc(lt.name)+’" data-proj="’+f1(lt.proj||0)+’" value="’+f1(lt.bust_trigger||0)+’" aria-label="Bust trigger for ‘+esc(lt.name)+’"><span>pts</span></div>’
              +’<div><button class="lk-btn" data-player="’+esc(lt.name)+’" aria-label="Lock ‘+esc(lt.name)+’">LOCK</button></div>’;
          }
        }
        out+=’</div>’;
        if(isToday&&!isLocked&&lt.fallbacks&&lt.fallbacks.length){
          out+=’<div class="fb-block">’;
          lt.fallbacks.forEach(function(fb){
            out+=’<div class="fb-row’+(fb.conflict?’ conflict-fb’:’’)+’"><span class="fb-arr">↳</span><div class="fb-body">’
              +’<span class="fb-instr">’+esc(fb.instruction)+(fb.pace_scaled?’ <span style="color:var(--muted);font-weight:500;font-size:11px">(pace-scaled)</span>’:’’)+’</span>’
              +’<span class="fb-meta">’+esc(fb.name)+’ &middot; ‘+esc(fmtTime(fb.tip_utc))+’ &middot; proj ‘+f1(fb.proj)+(fb.conflict?’ &middot; <span style="color:var(--red)">&#9888; shared fallback</span>’:’’)+’</span>’
              +’</div></div>’;
          });
          out+=’</div>’;
        }
      });
      Object.keys(plan.conflicts).forEach(function(nm){
        out+=’<div class="conf-banner">&#9888; <strong>’+esc(nm)+’</strong> is the top fallback for multiple slots (‘+plan.conflicts[nm].map(esc).join(‘, ‘)+’).</div>’;
      });
    } else {
      out+=’<p style="color:var(--muted);font-size:13px;margin:0 0 14px">No R260 lock targets have their best game today.</p>’;
    }

    // --- Section 2: Already settled ---
    if(plan.settled.length){
      out+=’<p class="pl-sec-hd pl-sec-settled">Already settled</p>’;
      out+=’<div class="ps-hd ps-hd-sm"><div></div><div>Player</div><div></div><div>Locked</div></div>’;
      plan.settled.forEach(function(s){
        out+=’<div class="ps ps-settled">’
          +’<div class="lb">’+esc(s.r260Slot)+’</div>’
          +’<div class="pn">’+esc(s.name)+’</div>’
          +’<div class="ti" style="color:var(--muted);font-size:11px">’+esc(s.lockDay)+’ actual</div>’
          +’<div class="pj settled-val">’+f1(s.lockScore)+’</div>’
          +’</div>’;
      });
    }

    // --- Section 3: Future locks ---
    if(plan.lockFuture.length){
      out+=’<p class="pl-sec-hd pl-sec-future">Locking in later</p>’;
      out+=’<div class="ps-hd ps-hd-sm"><div></div><div>Player</div><div></div><div>Lock est.</div></div>’;
      plan.lockFuture.forEach(function(s){
        out+=’<div class="ps ps-settled">’
          +’<div class="lb">’+esc(s.r260Slot)+’</div>’
          +’<div class="pn">’+esc(s.name)+’</div>’
          +’<div class="ti" style="color:var(--muted);font-size:11px">locks ‘+esc(s.lockDay)+’</div>’
          +’<div class="pj" style="color:var(--muted)">’+f1(s.lockScore)+’</div>’
          +’</div>’;
      });
    }

    bodyEl.innerHTML=out;

    if(isToday&&plan.timeline.length){
      var tl=’<div class="tl-wrap"><p class="cap">Today\’s decision timeline</p>’;
      plan.timeline.forEach(function(ev){
        var t=fmtTime(ev.tip_utc),isTip=ev.type===’starter_tip’;
        tl+=’<div class="tl-row’+(isTip?’ tip-evt’:’’)+’"><div class="tl-time">’+esc(t)+’</div><div class="tl-text">’+(isTip?esc(ev.player)+’ (‘+esc(ev.slot)+’) tips’:esc(ev.instruction))+’</div></div>’;
      });
      tl+=’</div>’;
      tlEl.innerHTML=tl;
    } else tlEl.innerHTML=’’;

    bodyEl.querySelectorAll(‘.lk-btn’).forEach(function(btn){
      var nm=btn.dataset.player;
      if(getLockByPlayer(nm))btn.classList.add(‘on’);
      btn.addEventListener(‘click’,function(){var on=!getLockByPlayer(nm);setLockByPlayer(nm,on);renderPlan();});
    });
    bodyEl.querySelectorAll(‘.bt-in’).forEach(function(inp){
      inp.addEventListener(‘change’,function(){var v=parseFloat(inp.value);if(!isNaN(v)&&v>=0){setBust(inp.dataset.name,v);renderPlan();}});
    });
    document.getElementById(‘plan-day-label’).textContent=(activeDayIso===todayIso?’Today · ‘:’’)+activeDayIso;
  }

  var tabsEl=document.getElementById('plan-tabs');
  if(tabsEl){
    tabsEl.innerHTML=DATA.week.days.map(function(d){
      return'<button class="plan-tab" role="tab" aria-selected="'+(d.iso===activeDayIso?'true':'false')+'" data-iso="'+d.iso+'">'+(d.today?'Today · ':'')+d.key+' '+d.date+'</button>';
    }).join('');
    tabsEl.querySelectorAll('.plan-tab').forEach(function(btn){
      btn.addEventListener('click',function(){
        activeDayIso=btn.dataset.iso;
        tabsEl.querySelectorAll('.plan-tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.iso===activeDayIso?'true':'false');});
        renderPlan();
      });
    });
  }
  renderPlan();
})();
