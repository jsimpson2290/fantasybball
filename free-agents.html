    <td class="num c-ceil2" style="color:var(--ceil)">${f1(x.ceil2 ?? (x.mu + 2.0 * x.sd))}</td>

    <td class="num lock-cell"><b>${x.lock.toFixed(2)}</b><div class="sub">${Math.round(x.pe*100)}% x ${x.g} g</div></td></tr>`).join('');
  attachGameLog();
  attachBarInputs();
  const trendings=D.trending_fas||[];
  const tsect=$('#trending-section');
  if(trendings.length){
    tsect.hidden=false;
    tsect.innerHTML=`<h2>Trending adds right now</h2>
<p class="meta" style="margin:2px 0 8px">Free agents with the most Sleeper add transactions in the last 24 hours who aren’t in the top 10 above. High add volume means the community has spotted something — an injury to a teammate, a role change, or a breakout. Ranked by add count, not by the lockable model. <b>OPP</b> means injury context is confirmed from the opportunity board.</p>
<div class="trend-grid">`+trendings.map(t=>{
      const hasStats=t.mpg!=null;
      const stats=hasStats?`${f1(t.mpg)} min/g \xb7 avg ${f1(t.avg)} FP \xb7 ${t.n} g${t.lock!=null?' \xb7 lockable '+t.lock.toFixed(2)+' ('+t.g+' g this week)':''}`
        :(t.n?`${t.n} g on record — below MPG/games threshold`:'No season data yet');
      return `<div class="trend-card">
  <div class="trend-header"><span class="trend-rank">#${t.trend_rank}</span><b>${esc(t.name)}</b>
    <span class="tm">${esc(t.team)}</span>${t.pos?` <span class="tm">${esc(t.pos)}</span>`:''}
    ${t.opp_reason?`<span class="chip opp" title="Opportunity: ${esc(t.opp_reason)}">OPP</span>`:''}
    ${t.status==='GTD'?`<span class="chip warn">GTD</span>`:''}
  </div>
  <div class="meta">${esc(stats)}</div>
  <div class="trend-count">${Number(t.trend_adds).toLocaleString()} adds today</div>
</div>`;
    }).join('')+`</div>`;
  }
  const c=D.meta.counts||{}, f=D.meta.filters||{};
  $('#notes').innerHTML=`<details><summary><h2>How this list is built</h2><span class="hint">click to show</span></summary>
  <p>This page uses the same data and the same model as the roster ranking, so a free agent and one of my players are measured the same way.</p>
  <h3>Who is on the list</h3>
  <p>Free agents in my Sleeper league (${c.free??'?'} right now) who have played at least ${f.minGames} games and ${f.minMpg} minutes per game this season and are not listed Out or on IR. ${c.qualified??'?'} qualified; the top ${f.top} by lockable games are shown. A Questionable or Doubtful player is kept and marked GTD.</p>
  <h3>The numbers</h3>
  <ul>
   <li><b>MPG</b> is this season's minutes per game.</li>
   <li><b>Mean FP</b> is the expected points per game: ${Math.round(M.wLast*100)}% last season's average and ${Math.round((1-M.wLast)*100)}% my preseason projection (last season's average alone if he was not projected; a replacement-level default if there is no history), updated with this season's games as (sum of scores + ${M.k} x starting point) / (games + ${M.k}). The line under it is his raw average this season.</li>
   <li><b>+1 SD</b>, <b>+1.5 SD</b>, <b>+2 SD</b> are ceiling projections at increasing confidence intervals above the mean. About 1 game in 6 lands above +1 SD; about 1 in 14 above +2 SD. SD is from last season when he had ${M.minEmpirical}+ games, otherwise the assumed ${M.sdAssumed}.</li>
   <li>Click a player's name to see his 2026-27 game-by-game stats.</li>
   <li><b>Bar</b> is the lock threshold (40 at 35+ expected, 30 at 25+, else 26). <b>Lockable games</b> is the chance a game clears it, times the games this week. The Bar cell is editable: type a number to recompute lockable games on the fly.</li>
  </ul>
  <h3>Replaces, and position fit</h3>
  <p>My lineup has ${((D.meta.lineup&&D.meta.lineup.slots)||[]).join(', ')||'position slots'}. A player can fill a slot only if his position eligibility matches (G takes a PG or SG, F takes an SF or PF, UTIL takes anyone). For each drop candidate the page asks: if I drop him and add this free agent, can my roster still fill every slot? If not, that free agent cannot replace him, and a free agent who cannot replace either is left off the list (they are named under the table).</p>
  <p>The green chip "replaces X" means he can fill a slot after the swap and also beats X on both measures: higher mean FP and higher lockable games. A muted chip "no slot for X" means he is better on the numbers but no lineup slot works. "Would start at G" in the reason line comes from re-picking my best lineup (highest total lockable games) with the swap made; the number is how many lockable games that adds. If he would not crack my starting lineup the line says so: he is bench depth, whatever his numbers.</p>
  <h3>The why line, OPP chip, and TREND chip</h3>
  <p>The <b>OPP</b> chip (blue) marks a free agent whose teammate is injured and may be getting elevated minutes; hover the chip to see the injured player's name. The <b>TREND</b> chip (purple) marks a player currently in the top-25 Sleeper adds league-wide in the last 24 hours — high add volume is a leading indicator that the community has spotted something (an injury, a role change, a breakout) that may not yet appear in official injury reports or projections. Both chips can appear together. Written by rules from the numbers, at most two reasons in the why line: injury context, trending signal, minutes up from last season or a starter-level role, games at the lock bar. Cautions are added for fewer than 3 games or a game-time decision.</p>
  <h3>Trending adds section</h3>
  <p>The "Trending adds right now" section below the main table shows free agents who appear in the Sleeper add leaderboard but did not rank in the top 10 by the lockable model. Early in the season a player's mean score is shrunk toward last season's projection, so a player with a strong trending signal and a small 2026-27 sample may not crack the top 10 despite being a clear pickup. The trending section surfaces those players directly. A sort boost (1.3× for top-5 trending, 1.15× for #6-25) is applied in the main ranking, so strongly trending players do bubble up when their underlying stats support it.</p>
  <h3>What it cannot see</h3>
  <ul>
   <li>Small samples. Early in the season a free agent's mean rests mostly on last season and the projection; look at the games count.</li>
   <li>Whether a role lasts. A minutes bump caused by an injury ends when the teammate returns.</li>
   <li>Bench rules and trades. Only starting-lineup slots and position eligibility are modeled. Treat this as a shortlist, not a recommendation.</li>
   <li>Back-to-backs and rest days inside the week.</li>
  </ul></details>`;
  $('#foot').textContent=`Built ${D.meta.asOf}. Data: Sleeper (who is free), NBA Stats box scores through the nba-data skill, the same schedule file as the roster page.`;
}
function erfcApprox(x){if(x<0)return 2-erfcApprox(-x);const t=1/(1+0.3275911*x);const p=t*(0.254829592+t*(-0.284496736+t*(1.421413741+t*(-1.453152027+t*1.061405429))));return p*Math.exp(-x*x);}
function pAbove(bar,mu,sd){if(sd<=0)return bar<=mu?1:0;return 0.5*erfcApprox((bar-mu)/(sd*Math.SQRT2));}
function attachBarInputs(){
  const fas=DATA.fas||[];
  document.querySelectorAll('.bar-inp').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const bar=Math.max(1,+inp.value||1);
      const tr=inp.closest('tr.fa-row');
      const x=fas[+tr.dataset.idx];
      const pe=pAbove(bar,x.mu,x.sd);
      const lock=pe*x.g;
      const cell=tr.querySelector('.lock-cell');
      cell.innerHTML=`<b>${lock.toFixed(2)}</b><div class="sub">${Math.round(pe*100)}% x ${x.g} g</div>`;
    });
  });
}
function attachGameLog(){
  const fas=DATA.fas||[];
  document.querySelectorAll('.pname').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const tr=el.closest('tr.fa-row');
      const fa=fas[+tr.dataset.idx];
      const nxt=tr.nextElementSibling;
      if(nxt&&nxt.classList.contains('fa-expand')){nxt.remove();return;}
      if(!fa||!fa.games_log||!fa.games_log.length){return;}
      const ncols=tr.querySelectorAll('td').length;
      const ex=document.createElement('tr');
      ex.className='fa-expand';
      const hdrs=['Date','Min','PTS','REB','AST','STL','BLK','TO','3PM','FP'];
      const grows=fa.games_log.map(g=>{
        const vals=[g.date,f1(g.min),g.pts,g.reb,g.ast,g.stl,g.blk,g.tov,g.fg3m,f1(g.fp)];
        return '<tr>'+vals.map((v,i)=>`<td style="padding:4px 10px;text-align:right;border-bottom:1px solid var(--line)${i===9?';color:var(--ceil);font-weight:700':''}">${v}</td>`).join('')+'</tr>';
      }).join('');
      ex.innerHTML=`<td colspan="${ncols}" style="padding:0;border-bottom:2px solid var(--line)"><div style="padding:10px 16px;background:var(--chip);overflow-x:auto"><div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink)">${esc(fa.name)} &#8212; 2026-27 game log</div><table style="width:auto;font-size:13px;border-collapse:collapse"><thead><tr>${hdrs.map(h=>`<th style="padding:4px 10px;text-align:right;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap">${h}</th>`).join('')}</tr></thead><tbody>${grows}</tbody></table></div></td>`;
      tr.after(ex);
    });
  });
}
render();
(function(){
  var f=location.protocol==='file:';
  var u={roster:f?'roster_quickref.html':'index.html',fa:f?'free_agents.html':'free-agents.html',r260:f?'road_to_260.html':'road-to-260.html'};
  var t=document.title;
  var cur=t.indexOf('Free Agent')>-1?'fa':t.indexOf('260')>-1?'r260':'roster';
  ['roster','fa','r260'].forEach(function(k){
    var d=document.getElementById('nav-'+k),m=document.getElementById('nav-'+k+'-m');
    if(d){d.href=u[k];if(k===cur)d.setAttribute('aria-current','page');}
    if(m){m.href=u[k];if(k===cur)m.setAttribute('aria-current','page');}
  });
  var KEY='qrNavOpen',rail=document.getElementById('qrnav-rail'),btn=document.getElementById('qrnav-toggle');
  var open=false;try{open=localStorage.getItem(KEY)==='1';}catch(e){}
  function apply(){
    rail.classList.toggle('open',open);
    btn.setAttribute('aria-expanded',open?'true':'false');
    btn.setAttribute('aria-label',open?'Collapse navigation':'Expand navigation');
  }
  apply();
  btn.addEventListener('click',function(){open=!open;try{localStorage.setItem(KEY,open?'1':'0');}catch(e){}apply();});
})();
</script>
